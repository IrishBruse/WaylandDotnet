name: Update scanner output

on:
  schedule:
    # Weekly on Friday at 18:00 UTC
    - cron: "0 18 * * 5"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: update-scanner
  cancel-in-progress: true

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Download protocol XML
        working-directory: WaylandDotnet.Scanner
        run: dotnet run --configuration Release -- download

      - name: Generate bindings and docs
        working-directory: WaylandDotnet.Scanner
        run: dotnet run --configuration Release

      - name: Build and test
        run: |
          dotnet build --configuration Release
          dotnet test --configuration Release --no-build

      - name: Summarize protocol changes
        id: summary
        env:
          PR_BODY_PATH: ${{ runner.temp }}/pr-body.md
        run: python3 .github/scripts/summarize-protocol-changes.py >> "$GITHUB_OUTPUT"

      - name: Configure git identity for automation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create pull request
        id: pr
        continue-on-error: true
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automated/scanner-update
          delete-branch: true
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          commit-message: ${{ steps.summary.outputs.commit_message }}
          title: ${{ steps.summary.outputs.title }}
          body-path: ${{ runner.temp }}/pr-body.md
          labels: |
            automated
            protocols

      - name: Open issue when pull request creation fails
        if: steps.pr.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          compare_url="https://github.com/${{ github.repository }}/compare/main...automated/scanner-update"
          run_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body_file="${{ runner.temp }}/pr-issue-body.md"
          {
            echo "The scanner workflow updated \`automated/scanner-update\` but GitHub did not create a pull request."
            echo ""
            echo "**Compare and open a PR manually:** ${compare_url}"
            echo ""
            echo "**Workflow run:** ${run_url}"
            echo ""
            echo "If this repeats, check [GitHub pull request creation](https://github.com/${{ github.repository }}/pulls) or contact GitHub support with the request id from the failed job log."
          } > "$body_file"
          gh issue create \
            --title "Scanner update: pull request creation failed" \
            --label automated \
            --body-file "$body_file"
          echo "::warning::create-pull-request failed; opened an issue with the compare link for a manual PR."
